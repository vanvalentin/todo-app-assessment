name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.12.0"
  PNPM_VERSION: "11.18.0"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # The dependency cache key is derived from pnpm-lock.yaml.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Compose configuration
        run: pnpm compose:config

  database:
    name: Migrations and PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_DB: ksat
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: >-
        postgresql://postgres:postgres@127.0.0.1:5432/ksat
      INTEGRATION_DATABASE_URL: >-
        postgresql://postgres:postgres@127.0.0.1:5432/ksat
      SHADOW_DATABASE_URL: >-
        postgresql://postgres:postgres@127.0.0.1:5432/ksat_shadow
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm --filter @ksat/api db:generate

      - name: Apply the committed migrations
        run: pnpm --filter @ksat/api db:migrate

      - name: Create the shadow database
        run: >-
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres
          -c 'CREATE DATABASE ksat_shadow;'

      - name: Guard against migration drift
        run: pnpm --filter @ksat/api db:migrate:diff

      - name: PostgreSQL integration tests
        run: pnpm --filter @ksat/api test:integration

  browser:
    name: Playwright journeys
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_DB: ksat
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.21.8
        ports:
          - 8025:8025
          - 1025:1025
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:8025/api/v1/info"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ksat
      REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_URL: http://localhost:5173
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:5173
      BETTER_AUTH_SECRET: ci-only-ksat-better-auth-secret-change-before-use
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: ksat
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio123
      MAILPIT_BASE_URL: http://127.0.0.1:8025
      E2E_BASE_URL: http://localhost:5173
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Upstream images and binary archives are no longer public.
      # Build RELEASE.2025-04-22T22-12-26Z from its pinned source commit.
      - name: Cache the MinIO binary
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: .tmp/minio-bin
          key: >-
            minio-Linux-X64-go1.24.2-0d7408fc9969caf07de6a8c3a84f9fbb10a6739e

      - name: Check out the pinned MinIO source
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: minio/minio
          ref: 0d7408fc9969caf07de6a8c3a84f9fbb10a6739e
          path: .tmp/minio-source
          persist-credentials: false

      - name: Set up Go for MinIO
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache-dependency-path: .tmp/minio-source/go.sum

      - name: Build MinIO
        if: steps.minio-cache.outputs.cache-hit != 'true'
        working-directory: .tmp/minio-source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp/minio-bin"
          go build -trimpath -o "$GITHUB_WORKSPACE/.tmp/minio-bin/minio" .

      - name: Start MinIO
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: minio123
        run: |
          nohup .tmp/minio-bin/minio server "$RUNNER_TEMP/minio-data" \
            --address :9000 --console-address :9001 > minio.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/ready \
              > /dev/null; then
              echo "minio is ready"
              exit 0
            fi
            sleep 1
          done
          echo "minio did not become ready"
          cat minio.log
          exit 1

      - name: Create and verify the attachment bucket
        working-directory: apps/api
        run: |
          node --input-type=module <<'NODE'
          import {
            S3Client, CreateBucketCommand, HeadBucketCommand,
          } from '@aws-sdk/client-s3';
          const client = new S3Client({
            endpoint: process.env.S3_ENDPOINT,
            region: 'us-east-1',
            forcePathStyle: true,
            credentials: {
              accessKeyId: process.env.S3_ACCESS_KEY_ID,
              secretAccessKey: process.env.S3_SECRET_ACCESS_KEY,
            },
          });
          try {
            const input = { Bucket: process.env.S3_BUCKET };
            await client.send(new CreateBucketCommand(input));
            await client.send(new HeadBucketCommand(input));
          } finally {
            client.destroy();
          }
          NODE

      - name: Prepare the database
        env:
          SEED_DEMO_DATA: "true"
        run: |
          pnpm --filter @ksat/api db:generate
          pnpm --filter @ksat/api db:migrate
          pnpm db:seed

      - name: Start the API
        run: nohup pnpm --filter @ksat/api dev > api.log 2>&1 &

      - name: Start the web client
        run: nohup pnpm --filter @ksat/web dev > web.log 2>&1 &

      - name: Wait for the application
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/health/ready > /dev/null \
              && curl -sf http://127.0.0.1:5173 > /dev/null; then
              echo "application is ready"
              exit 0
            fi
            sleep 2
          done
          echo "application did not become ready"
          cat api.log web.log
          exit 1

      - name: Run the browser journeys
        run: pnpm exec playwright test

      - name: Show server logs
        if: failure()
        run: |
          for log in minio.log api.log web.log; do
            if [ -f "$log" ]; then
              echo "::group::$log"
              cat "$log"
              echo "::endgroup::"
            fi
          done

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report
            test-results
            minio.log
            api.log
            web.log
          retention-days: 7
